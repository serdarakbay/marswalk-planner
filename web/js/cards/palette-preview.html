<!doctype html>
<!-- Dev-only (Egemen): shows the real app with the proposed regolith palette applied on top.
     Nothing in the app changes; the palette lives in base.css (Ege) once it is accepted.
     Open: python -m http.server 8000 -d web  ->  http://localhost:8000/js/cards/palette-preview.html -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palette preview</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto 1fr; font: 14px system-ui, sans-serif; }
    .bar { display: flex; gap: 12px; align-items: center; padding: 6px 12px; background: #2A201B; color: #F7F2EA; }
    .bar label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Palette preview</strong>
    <label><input id="on" type="checkbox" checked> Regolith palette (proposal)</label>
    <span>Dev only. The app itself is unchanged.</span>
  </div>
  <iframe id="app" src="../../index.html?nocache=1" title="Martian Map"></iframe>
  <script>
    const PALETTE = `:root {
      --color-bg: #F7F2EA; --color-surface: #F7F2EA; --color-surface-2: #EEE4D6;
      --color-border: color-mix(in srgb, #6B5A4E 28%, #F7F2EA);
      --color-text: #2A201B; --color-text-muted: #6B5A4E; --color-text-inverse: #F7F2EA;
      --color-accent: #B4532A; --color-accent-hover: #9C4220; --color-accent-text: #9C4220;
      --color-sand: #8A6A2E; --color-dust: #6B5A4E; --color-clay: #6F7F68; --color-sulfate: #8A6A2E;
      --color-ok: #6F7F68; --color-warn: #9C4220; --color-danger: #B3302A; --color-info: #41627F;
      --shadow: 0 4px 16px color-mix(in srgb, #2A201B 14%, transparent);
      color-scheme: light;
    }`;
    const frame = document.getElementById('app');
    const box = document.getElementById('on');
    function apply() {
      const doc = frame.contentDocument;
      if (!doc?.head) return;
      let st = doc.getElementById('palette-preview');
      if (!st) { st = doc.createElement('style'); st.id = 'palette-preview'; doc.head.append(st); }
      st.textContent = box.checked ? PALETTE : '';
    }
    frame.addEventListener('load', apply);
    // The palette must be in place before the 3D view reads its colours: reload the app on toggle.
    box.addEventListener('change', () => frame.contentWindow.location.reload());
  </script>
</body>
</html>
